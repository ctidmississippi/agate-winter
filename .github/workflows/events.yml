name: Update events
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and fill results
        run: python3 scripts/update_events.py
      - name: Commit changes
        run: |
          git config user.name "agate-bot"
          git config user.email "agate-bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || (git commit -m "Fill event results" && git push)
